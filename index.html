<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Naruto: Chroniques Ninja (Prototype)</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b2838 0%, #0d1117 100%);
      color: #f0f6fc; font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }
    #top-bar {
      padding: 10px 20px; display: flex; justify-content: space-between;
      background: rgba(0,0,0,0.5); border-bottom: 1px solid #30363d; font-size: 14px;
    }
    #combat-zone {
      display: flex; justify-content: space-around; align-items: center;
      flex: 1; width: 100%; max-width: 900px; margin: 0 auto; position: relative;
    }
    .fighter {
      display: flex; flex-direction: column; align-items: center; width: 180px; text-align: center;
    }
    .portrait {
      width: 100px; height: 100px; border-radius: 16px; display: flex; align-items: center;
      justify-content: center; font-size: 44px; margin-bottom: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .naruto-box { background: #d97706; border: 3px solid #f59e0b; }
    .zabuza-box { background: #1e3a5f; border: 3px solid #38bdf8; }
    .bar-container {
      width: 100%; height: 14px; background: #21262d; border-radius: 7px;
      overflow: hidden; margin-bottom: 6px; border: 1px solid #30363d;
    }
    .bar-fill { height: 100%; transition: width 0.2s; }
    .hp-fill { background: #ef4444; }
    .shield-badge { font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 4px; }
    .clones-counter { font-size: 13px; color: #f59e0b; font-weight: bold; }
    .intent-bubble {
      background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171;
      border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: bold; margin-bottom: 10px;
    }
    #hand-zone {
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: 20px; background: rgba(0,0,0,0.4); border-top: 1px solid #30363d;
    }
    #chakra-display { font-size: 18px; font-weight: 800; color: #38bdf8; margin: 10px 0; }
    #hand { display: flex; gap: 12px; margin-bottom: 12px; min-height: 180px; }
    .card {
      width: 135px; height: 180px; background: #161b22; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
      border: 2px solid #30363d; transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-12px); border-color: #f59e0b; }
    .card-taijutsu { border-left: 4px solid #ef4444; }
    .card-clones { border-left: 4px solid #f59e0b; }
    .card-kyubi { border-left: 4px solid #a855f7; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 12px; font-weight: bold; }
    .card-cost {
      background: #38bdf8; color: #0d1117; font-weight: 900;
      width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .card-desc { font-size: 11px; color: #8b949e; line-height: 1.3; }
    .card-tag { font-size: 9px; text-transform: uppercase; font-weight: bold; color: #6e7681; }
    #end-turn-btn {
      padding: 10px 24px; background: #238636; border: none; border-radius: 6px;
      color: #fff; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    #end-turn-btn:hover { background: #2ea043; }
    #log { position: absolute; top: 10px; font-size: 14px; color: #f59e0b; font-weight: bold; }
    #overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none;
      flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    }
    #rewards-picker { display: flex; gap: 16px; margin-top: 20px; }
  </style>
</head>
<body>

  <div id="top-bar">
    <span>Arc : Le Pays des Vagues (Boss)</span>
    <span id="deck-info">Pioche : 0 | Défausse : 0</span>
  </div>

  <div id="combat-zone">
    <div id="log">À toi de jouer, Naruto !</div>

    <!-- Naruto -->
    <div class="fighter">
      <div class="portrait naruto-box">🍥</div>
      <div class="bar-container"><div id="player-hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
      <div id="player-hp-txt">60 / 60 PV</div>
      <div class="shield-badge" id="player-shield">Bouclier : 0</div>
      <div class="clones-counter" id="player-clones">Clones actifs : 0</div>
    </div>

    <!-- Zabuza -->
    <div class="fighter">
      <div class="intent-bubble" id="zabuza-intent">Prépare : Trancheuse (10)</div>
      <div class="portrait zabuza-box">🗡️</div>
      <div class="bar-container"><div id="enemy-hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
      <div id="enemy-hp-txt">75 / 75 PV</div>
      <div class="shield-badge" id="enemy-shield">Bouclier : 0</div>
    </div>
  </div>

  <div id="hand-zone">
    <div id="chakra-display">Chakra : 3 / 3</div>
    <div id="hand"></div>
    <button id="end-turn-btn" onclick="endTurn()">Fin du tour</button>
  </div>

  <div id="overlay">
    <h2 style="color:#f59e0b; font-size: 26px;">VICTOIRE SUR ZABUZA !</h2>
    <p style="color:#8b949e; margin-top: 6px;">Choisis une technique à intégrer à ton deck :</p>
    <div id="rewards-picker"></div>
  </div>

  <script>
    const state = {
      player: { hp: 60, maxHp: 60, shield: 0, chakra: 3, maxChakra: 3, clones: 0 },
      enemy: { hp: 75, maxHp: 75, shield: 0, mist: false, turnCount: 1 },
      deck: [],
      hand: [],
      discard: []
    };

    const CARDS_POOL = [
      { name: "Coup de Poing", cost: 1, type: "taijutsu", dmg: 6, shield: 0, clones: 0, desc: "Inflige 6 dégâts." },
      { name: "Kawarimi", cost: 1, type: "taijutsu", dmg: 0, shield: 6, clones: 0, desc: "Substitution (+6 bouclier)." },
      { name: "Kage Bunshin", cost: 2, type: "clones", dmg: 0, shield: 0, clones: 2, desc: "+2 Clones (+3 dégâts chacun en fin de tour)." },
      { name: "Naruto Rendan", cost: 2, type: "clones", dmg: 8, shield: 0, clones: 0, desc: "8 dégâts + 4 par clone actif." },
      { name: "Rage du Démon", cost: 0, type: "kyubi", dmg: 14, selfDmg: 4, shield: 0, clones: 0, desc: "Perds 4 PV. Inflige 14 dégâts immédiats." }
    ];

    function initGame() {
      state.deck = [
        { ...CARDS_POOL[0] }, { ...CARDS_POOL[0] }, { ...CARDS_POOL[0] },
        { ...CARDS_POOL[1] }, { ...CARDS_POOL[1] }, { ...CARDS_POOL[1] },
        { ...CARDS_POOL[2] }, { ...CARDS_POOL[2] },
        { ...CARDS_POOL[3] },
        { ...CARDS_POOL[4] }
      ];
      shuffle(state.deck);
      drawCards(4);
      updateUI();
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function drawCards(n) {
      for (let i = 0; i < n; i++) {
        if (state.deck.length === 0) {
          if (state.discard.length === 0) break;
          state.deck = state.discard.slice();
          state.discard = [];
          shuffle(state.deck);
        }
        if (state.deck.length > 0) {
          state.hand.push(state.deck.pop());
        }
      }
      renderHand();
      updateCounters();
    }

    function playCard(idx) {
      const card = state.hand[idx];
      if (!card || state.player.chakra < card.cost) return;

      state.player.chakra -= card.cost;

      if (card.selfDmg) {
        state.player.hp = Math.max(1, state.player.hp - card.selfDmg);
      }
      if (card.shield) state.player.shield += card.shield;
      if (card.clones) state.player.clones += card.clones;

      let dmg = card.dmg;
      if (card.name === "Naruto Rendan") {
        dmg += (state.player.clones * 4);
      }

      if (dmg > 0) {
        if (state.enemy.mist && state.player.clones < 2 && Math.random() < 0.5) {
          document.getElementById("log").innerText = "Attaque ratée dans le brouillard de Zabuza !";
        } else {
          dealDamageToEnemy(dmg);
        }
      }

      state.discard.push(state.hand.splice(idx, 1)[0]);
      updateUI();
      renderHand();

      if (state.enemy.hp <= 0) triggerVictory();
    }

    function dealDamageToEnemy(amt) {
      if (state.enemy.shield > 0) {
        if (amt <= state.enemy.shield) {
          state.enemy.shield -= amt; amt = 0;
        } else {
          amt -= state.enemy.shield; state.enemy.shield = 0;
        }
      }
      state.enemy.hp = Math.max(0, state.enemy.hp - amt);
    }

    function endTurn() {
      if (state.enemy.hp <= 0) return;

      // Attaque des clones
      if (state.player.clones > 0) {
        const cDmg = state.player.clones * 3;
        dealDamageToEnemy(cDmg);
        document.getElementById("log").innerText = `Les clones frappent pour ${cDmg} dégâts !`;
      }

      // Défausse
      while (state.hand.length > 0) {
        state.discard.push(state.hand.pop());
      }
      renderHand();

      if (state.enemy.hp <= 0) { triggerVictory(); return; }

      // Tour de Zabuza
      const step = ((state.enemy.turnCount - 1) % 3) + 1;
      if (step === 1) {
        hitPlayer(10);
        state.enemy.mist = false;
      } else if (step === 2) {
        state.enemy.shield += 12;
        state.enemy.mist = true;
        document.getElementById("log").innerText = "Zabuza disparaît dans le brouillard !";
      } else if (step === 3) {
        hitPlayer(15);
        state.player.clones = 0;
        document.getElementById("log").innerText = "Suiton : Grande Cataracte dissipe tes clones !";
        state.enemy.mist = false;
      }

      if (state.player.hp <= 0) {
        document.getElementById("log").innerText = "Défaite... Zabuza t'a terrassé.";
        return;
      }

      state.player.shield = 0;
      state.player.chakra = state.player.maxChakra;
      state.enemy.turnCount++;
      drawCards(4);
      updateUI();
    }

    function hitPlayer(amt) {
      if (state.player.shield > 0) {
        if (amt <= state.player.shield) {
          state.player.shield -= amt; amt = 0;
        } else {
          amt -= state.player.shield; state.player.shield = 0;
        }
      }
      state.player.hp = Math.max(0, state.player.hp - amt);
    }

    function renderHand() {
      const h = document.getElementById("hand");
      h.innerHTML = "";
      state.hand.forEach((card, i) => {
        const el = document.createElement("div");
        el.className = `card card-${card.type}`;
        el.onclick = () => playCard(i);
        el.innerHTML = `
          <div class="card-top">
            <span class="card-title">${card.name}</span>
            <span class="card-cost">${card.cost}</span>
          </div>
          <div class="card-desc">${card.desc}</div>
          <div class="card-tag">${card.type}</div>
        `;
        h.appendChild(el);
      });
    }

    function updateUI() {
      document.getElementById("player-hp-txt").innerText = `${state.player.hp} / ${state.player.maxHp} PV`;
      document.getElementById("player-hp-bar").style.width = `${(state.player.hp / state.player.maxHp) * 100}%`;
      document.getElementById("player-shield").innerText = `Bouclier : ${state.player.shield}`;
      document.getElementById("player-clones").innerText = `Clones actifs : ${state.player.clones}`;

      document.getElementById("enemy-hp-txt").innerText = `${state.enemy.hp} / ${state.enemy.maxHp} PV`;
      document.getElementById("enemy-hp-bar").style.width = `${(state.enemy.hp / state.enemy.maxHp) * 100}%`;
      document.getElementById("enemy-shield").innerText = `Bouclier : ${state.enemy.shield}`;
      document.getElementById("chakra-display").innerText = `Chakra : ${state.player.chakra} / ${state.player.maxChakra}`;

      const nextStep = (state.enemy.turnCount % 3) + 1;
      const intents = {
        1: "Prépare : Trancheuse de têtes (10)",
        2: "Prépare : Brouillard Silencieux (+12 bouclier)",
        3: "Prépare : Suiton Cataracte (15 + balaye les clones)"
      };
      document.getElementById("zabuza-intent").innerText = intents[nextStep];
      updateCounters();
    }

    function updateCounters() {
      document.getElementById("deck-info").innerText = `Pioche : ${state.deck.length} | Défausse : ${state.discard.length}`;
    }

    function triggerVictory() {
      document.getElementById("overlay").style.display = "flex";
      const picker = document.getElementById("rewards-picker");
      picker.innerHTML = "";

      const rewards = [
        { name: "Combo 2000 Poings", cost: 1, type: "taijutsu", dmg: 10, desc: "Frappe rapide (+10 dégâts bruts)." },
        { name: "Armée de Clones", cost: 3, type: "clones", clones: 4, desc: "Invoque 4 Clones massifs d'un coup." },
        { name: "Chakra Kyūbi", cost: 0, type: "kyubi", selfDmg: 6, desc: "Perds 6 PV. Récupère +3 Chakra immédiatement." }
      ];

      rewards.forEach(r => {
        const el = document.createElement("div");
        el.className = `card card-${r.type}`;
        el.style.transform = "scale(1.1)";
        el.innerHTML = `
          <div class="card-top"><span class="card-title">${r.name}</span><span class="card-cost">${r.cost}</span></div>
          <div class="card-desc">${r.desc}</div>
          <div class="card-tag">${r.type}</div>
        `;
        el.onclick = () => {
          alert(`Tu as débloqué [${r.name}] !`);
          location.reload();
        };
        picker.appendChild(el);
      });
    }

    // Lancement au chargement du DOM
    window.onload = initGame;
  </script>
</body>
</html>
