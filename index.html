<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Naruto: Chroniques Ninja (Pays des Vagues)</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b2838 0%, #0d1117 100%);
      color: #f0f6fc; font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }
    #top-bar {
      padding: 10px 24px; display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.6); border-bottom: 1px solid #30363d; font-size: 14px;
    }
    #stage-title { color: #f59e0b; font-weight: bold; }
    #combat-zone {
      display: flex; justify-content: space-around; align-items: flex-end;
      flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; position: relative;
      padding-bottom: 25px;
    }
    .fighter {
      display: flex; flex-direction: column; align-items: center; width: 260px; text-align: center;
      position: relative;
    }
    .sprite-stage {
      width: 220px; height: 260px; display: flex; align-items: flex-end; justify-content: center;
      margin-bottom: 12px; position: relative;
    }
    .fighter-img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.7));
      transition: transform 0.1s;
      z-index: 10;
    }
    .ground-shadow {
      position: absolute; bottom: 0; width: 140px; height: 18px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
      border-radius: 50%; z-index: 1;
    }

    /* Clones physiques sur le plateau */
    #clones-container {
      position: absolute; bottom: 0; left: -40px; display: flex; gap: -30px;
      pointer-events: none; z-index: 5;
    }
    .clone-sprite {
      width: 95px; height: 140px; object-fit: contain; opacity: 0.75;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)) hue-rotate(-20deg);
      animation: clone-spawn 0.3s ease-out;
      margin-right: -25px;
    }
    @keyframes clone-spawn {
      0% { transform: scale(0.4) translateY(20px); opacity: 0; filter: brightness(3); }
      100% { transform: scale(1) translateY(0); opacity: 0.75; }
    }

    @keyframes hit-shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 4px); filter: brightness(2) drop-shadow(0 0 10px #ef4444); }
      50% { transform: translate(8px, -4px); }
      75% { transform: translate(-4px, 2px); }
      100% { transform: translate(0, 0); }
    }
    .shake { animation: hit-shake 0.3s ease-in-out; }

    .bar-container {
      width: 100%; height: 14px; background: #21262d; border-radius: 7px;
      overflow: hidden; margin-bottom: 6px; border: 1px solid #30363d;
    }
    .bar-fill { height: 100%; transition: width 0.2s; }
    .hp-fill { background: #ef4444; }
    .shield-badge { font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 4px; }
    .intent-bubble {
      background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171;
      border-radius: 8px; padding: 4px 12px; font-size: 12px; font-weight: bold; margin-bottom: 10px;
    }

    #hand-zone {
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: 16px; background: rgba(0,0,0,0.55); border-top: 1px solid #30363d;
    }
    #chakra-display { font-size: 18px; font-weight: 800; color: #38bdf8; margin: 8px 0; }
    #hand { display: flex; gap: 12px; margin-bottom: 10px; min-height: 180px; }
    .card {
      width: 135px; height: 180px; background: #161b22; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
      border: 2px solid #30363d; transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-12px); border-color: #f59e0b; }
    .card-taijutsu { border-left: 4px solid #ef4444; }
    .card-clones { border-left: 4px solid #f59e0b; }
    .card-kyubi { border-left: 4px solid #a855f7; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 12px; font-weight: bold; }
    .card-cost {
      background: #38bdf8; color: #0d1117; font-weight: 900;
      width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .card-desc { font-size: 11px; color: #8b949e; line-height: 1.3; }
    .card-tag { font-size: 9px; text-transform: uppercase; font-weight: bold; color: #6e7681; }
    #end-turn-btn {
      padding: 10px 26px; background: #238636; border: none; border-radius: 6px;
      color: #fff; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    #end-turn-btn:hover { background: #2ea043; }
    #log { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #f59e0b; font-weight: bold; }
    
    #overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.88); display: none;
      flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    }
    #rewards-picker { display: flex; gap: 18px; margin-top: 24px; }
  </style>
</head>
<body>

  <div id="top-bar">
    <span id="stage-title">Étape 1/3 : Embuscade des Brigands</span>
    <span id="deck-info">Pioche : 0 | Défausse : 0</span>
  </div>

  <div id="combat-zone">
    <div id="log">À toi de jouer, Naruto !</div>

    <!-- Naruto & Clones -->
    <div class="fighter">
      <div class="sprite-stage" id="naruto-box">
        <div id="clones-container"></div>
        <img src="naruto.png" class="fighter-img" id="naruto-img" alt="Naruto" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><text y=\'50%\' x=\'50%\' dominant-baseline=\'central\' text-anchor=\'middle\' font-size=\'60\'>🍥</text></svg>';">
        <div class="ground-shadow"></div>
      </div>
      <div class="bar-container"><div id="player-hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
      <div id="player-hp-txt">60 / 60 PV</div>
      <div class="shield-badge" id="player-shield">Bouclier : 0</div>
      <div style="font-size: 13px; color: #f59e0b; font-weight: bold;" id="player-clones-txt">Clones actifs : 0</div>
    </div>

    <!-- Ennemi du stage -->
    <div class="fighter">
      <div class="intent-bubble" id="enemy-intent">Prépare une attaque</div>
      <div class="sprite-stage" id="enemy-box">
        <img src="zabuza.png" class="fighter-img" id="enemy-img" alt="Ennemi" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><text y=\'50%\' x=\'50%\' dominant-baseline=\'central\' text-anchor=\'middle\' font-size=\'60\'>🗡️</text></svg>';">
        <div class="ground-shadow"></div>
      </div>
      <div class="bar-container"><div id="enemy-hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
      <div id="enemy-hp-txt">35 / 35 PV</div>
      <div class="shield-badge" id="enemy-shield">Bouclier : 0</div>
    </div>
  </div>

  <div id="hand-zone">
    <div id="chakra-display">Chakra : 3 / 3</div>
    <div id="hand"></div>
    <button id="end-turn-btn" onclick="endTurn()">Fin du tour</button>
  </div>

  <!-- Écran de récompense & transition d'étape -->
  <div id="overlay">
    <h2 id="overlay-title" style="color:#f59e0b; font-size: 26px;">VICTOIRE !</h2>
    <p id="overlay-sub" style="color:#8b949e; margin-top: 6px;">Choisis une technique pour compléter ton deck :</p>
    <div id="rewards-picker"></div>
  </div>

  <script>
    const STAGES = [
      {
        id: 1,
        title: "Étape 1/3 : Mercenaires de Gatō",
        name: "Brigands du Port",
        maxHp: 38,
        sprite: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text y='50%' x='50%' dominant-baseline='central' text-anchor='middle' font-size='60'>🥷</text></svg>",
        pattern: [
          { intent: "Attaque groupée (6)", dmg: 6, shield: 0 },
          { intent: "Jet de sable (+6 bouclier)", dmg: 0, shield: 6 },
          { intent: "Embuscade rapide (8)", dmg: 8, shield: 0 }
        ]
      },
      {
        id: 2,
        title: "Étape 2/3 (Élite) : Les Frères Démons",
        name: "Gōzu & Meizu",
        maxHp: 55,
        sprite: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text y='50%' x='50%' dominant-baseline='central' text-anchor='middle' font-size='60'>⛓️</text></svg>",
        pattern: [
          { intent: "Griffes empoisonnées (9)", dmg: 9, shield: 0 },
          { intent: "Enchaînement coordonné (12)", dmg: 12, shield: 0 },
          { intent: "Garde d'acier (+10 bouclier)", dmg: 0, shield: 10 }
        ]
      },
      {
        id: 3,
        title: "Étape 3/3 (Boss Final) : Zabuza Momochi",
        name: "Zabuza Momochi",
        maxHp: 75,
        sprite: "zabuza.png",
        pattern: [
          { intent: "Trancheuse de têtes (10)", dmg: 10, shield: 0 },
          { intent: "Brouillard Silencieux (+12 bouclier)", dmg: 0, shield: 12, mist: true },
          { intent: "Suiton : Grande Cataracte (15 + balaye les clones)", dmg: 15, shield: 0, clearClones: true }
        ]
      }
    ];

    const CARDS_POOL = [
      { name: "Coup de Poing", cost: 1, type: "taijutsu", dmg: 6, shield: 0, clones: 0, desc: "Inflige 6 dégâts physiques." },
      { name: "Kawarimi", cost: 1, type: "taijutsu", dmg: 0, shield: 6, clones: 0, desc: "Bûche de substitution (+6 bouclier)." },
      { name: "Kage Bunshin", cost: 2, type: "clones", dmg: 0, shield: 0, clones: 2, desc: "+2 Clones (+3 dégâts chacun en fin de tour)." },
      { name: "Naruto Rendan", cost: 2, type: "clones", dmg: 8, shield: 0, clones: 0, desc: "8 dégâts + 4 par clone actif." },
      { name: "Rage du Démon", cost: 0, type: "kyubi", dmg: 14, selfDmg: 4, shield: 0, clones: 0, desc: "Perds 4 PV. Inflige 14 dégâts immédiats." }
    ];

    const REWARD_OPTIONS = [
      { name: "Combo 2000 Poings", cost: 1, type: "taijutsu", dmg: 10, shield: 0, clones: 0, desc: "Frappe de taijutsu lourde (+10 dégâts)." },
      { name: "Assaut Massif", cost: 2, type: "clones", dmg: 0, shield: 0, clones: 3, desc: "Invoque 3 clones d'un coup sur le terrain." },
      { name: "Chakra Rouge", cost: 0, type: "kyubi", dmg: 0, selfDmg: 5, chakraGain: 2, desc: "Perds 5 PV. Gagne immédiatement +2 Chakra." }
    ];

    let currentStageIndex = 0;
    const state = {
      player: { hp: 60, maxHp: 60, shield: 0, chakra: 3, maxChakra: 3, clones: 0 },
      enemy: { hp: 35, maxHp: 35, shield: 0, mist: false, turnCount: 1 },
      deck: [],
      hand: [],
      discard: []
    };

    function initGame() {
      state.deck = [
        { ...CARDS_POOL[0] }, { ...CARDS_POOL[0] }, { ...CARDS_POOL[0] },
        { ...CARDS_POOL[1] }, { ...CARDS_POOL[1] }, { ...CARDS_POOL[1] },
        { ...CARDS_POOL[2] }, { ...CARDS_POOL[2] },
        { ...CARDS_POOL[3] },
        { ...CARDS_POOL[4] }
      ];
      loadStage(0);
    }

    function loadStage(index) {
      currentStageIndex = index;
      const stage = STAGES[index];
      document.getElementById("stage-title").innerText = stage.title;

      state.enemy.hp = stage.maxHp;
      state.enemy.maxHp = stage.maxHp;
      state.enemy.shield = 0;
      state.enemy.mist = false;
      state.enemy.turnCount = 1;
      state.player.shield = 0;
      state.player.clones = 0;
      renderClones();

      // Mise à jour sprite ennemi
      const enemyImg = document.getElementById("enemy-img");
      if (stage.sprite.endsWith(".png")) {
        enemyImg.src = stage.sprite;
      } else {
        enemyImg.src = stage.sprite;
      }

      state.discard.push(...state.hand);
      state.hand = [];
      shuffle(state.deck);
      drawCards(4);
      updateUI();
      document.getElementById("log").innerText = `Combat : ${stage.name} !`;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function drawCards(n) {
      for (let i = 0; i < n; i++) {
        if (state.deck.length === 0) {
          if (state.discard.length === 0) break;
          state.deck = state.discard.slice();
          state.discard = [];
          shuffle(state.deck);
        }
        if (state.deck.length > 0) state.hand.push(state.deck.pop());
      }
      renderHand();
      updateCounters();
    }

    function renderClones() {
      const container = document.getElementById("clones-container");
      container.innerHTML = "";
      for (let i = 0; i < Math.min(state.player.clones, 4); i++) {
        const img = document.createElement("img");
        img.src = "naruto.png";
        img.className = "clone-sprite";
        img.onerror = () => { img.style.display = "none"; };
        container.appendChild(img);
      }
      document.getElementById("player-clones-txt").innerText = `Clones actifs : ${state.player.clones}`;
    }

    function triggerShake(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove("shake");
      void el.offsetWidth;
      el.classList.add("shake");
    }

    function playCard(idx) {
      const card = state.hand[idx];
      if (!card || state.player.chakra < card.cost) return;

      state.player.chakra -= card.cost;

      if (card.selfDmg) {
        state.player.hp = Math.max(1, state.player.hp - card.selfDmg);
        triggerShake("naruto-box");
      }
      if (card.chakraGain) {
        state.player.chakra += card.chakraGain;
      }
      if (card.shield) state.player.shield += card.shield;
      if (card.clones) {
        state.player.clones += card.clones;
        renderClones();
      }

      let dmg = card.dmg;
      if (card.name === "Naruto Rendan") dmg += (state.player.clones * 4);

      if (dmg > 0) {
        if (state.enemy.mist && state.player.clones < 2 && Math.random() < 0.5) {
          document.getElementById("log").innerText = "Attaque ratée dans le brouillard !";
        } else {
          dealDamageToEnemy(dmg);
        }
      }

      state.discard.push(state.hand.splice(idx, 1)[0]);
      updateUI();
      renderHand();

      if (state.enemy.hp <= 0) handleStageVictory();
    }

    function dealDamageToEnemy(amt) {
      triggerShake("enemy-box");
      if (state.enemy.shield > 0) {
        if (amt <= state.enemy.shield) {
          state.enemy.shield -= amt; amt = 0;
        } else {
          amt -= state.enemy.shield; state.enemy.shield = 0;
        }
      }
      state.enemy.hp = Math.max(0, state.enemy.hp - amt);
    }

    function endTurn() {
      if (state.enemy.hp <= 0) return;

      // Attaque des clones
      if (state.player.clones > 0) {
        const cDmg = state.player.clones * 3;
        dealDamageToEnemy(cDmg);
        document.getElementById("log").innerText = `Les clones frappent pour ${cDmg} dégâts !`;
      }

      while (state.hand.length > 0) state.discard.push(state.hand.pop());
      renderHand();

      if (state.enemy.hp <= 0) { handleStageVictory(); return; }

      // Tour ennemi
      const stage = STAGES[currentStageIndex];
      const move = stage.pattern[(state.enemy.turnCount - 1) % stage.pattern.length];

      if (move.dmg) hitPlayer(move.dmg);
      if (move.shield) state.enemy.shield += move.shield;
      state.enemy.mist = !!move.mist;
      if (move.clearClones) {
        state.player.clones = 0;
        renderClones();
        document.getElementById("log").innerText = "Grande Cataracte ! Tous tes clones sont balayés !";
      }

      if (state.player.hp <= 0) {
        document.getElementById("log").innerText = "Défaite... Mission échouée au Pays des Vagues.";
        return;
      }

      state.player.shield = 0;
      state.player.chakra = state.player.maxChakra;
      state.enemy.turnCount++;
      drawCards(4);
      updateUI();
    }

    function hitPlayer(amt) {
      triggerShake("naruto-box");
      if (state.player.shield > 0) {
        if (amt <= state.player.shield) {
          state.player.shield -= amt; amt = 0;
        } else {
          amt -= state.player.shield; state.player.shield = 0;
        }
      }
      state.player.hp = Math.max(0, state.player.hp - amt);
    }

    function renderHand() {
      const h = document.getElementById("hand");
      h.innerHTML = "";
      state.hand.forEach((card, i) => {
        const el = document.createElement("div");
        el.className = `card card-${card.type}`;
        el.onclick = () => playCard(i);
        el.innerHTML = `
          <div class="card-top">
            <span class="card-title">${card.name}</span>
            <span class="card-cost">${card.cost}</span>
          </div>
          <div class="card-desc">${card.desc}</div>
          <div class="card-tag">${card.type}</div>
        `;
        h.appendChild(el);
      });
    }

    function updateUI() {
      document.getElementById("player-hp-txt").innerText = `${state.player.hp} / ${state.player.maxHp} PV`;
      document.getElementById("player-hp-bar").style.width = `${(state.player.hp / state.player.maxHp) * 100}%`;
      document.getElementById("player-shield").innerText = `Bouclier : ${state.player.shield}`;

      document.getElementById("enemy-hp-txt").innerText = `${state.enemy.hp} / ${state.enemy.maxHp} PV`;
      document.getElementById("enemy-hp-bar").style.width = `${(state.enemy.hp / state.enemy.maxHp) * 100}%`;
      document.getElementById("enemy-shield").innerText = `Bouclier : ${state.enemy.shield}`;
      document.getElementById("chakra-display").innerText = `Chakra : ${state.player.chakra} / ${state.player.maxChakra}`;

      const stage = STAGES[currentStageIndex];
      const nextMove = stage.pattern[state.enemy.turnCount % stage.pattern.length];
      document.getElementById("enemy-intent").innerText = `Prépare : ${nextMove.intent}`;
      updateCounters();
    }

    function updateCounters() {
      document.getElementById("deck-info").innerText = `Pioche : ${state.deck.length} | Défausse : ${state.discard.length}`;
    }

    function handleStageVictory() {
      const isFinalBoss = (currentStageIndex === STAGES.length - 1);
      const overlay = document.getElementById("overlay");
      overlay.style.display = "flex";

      if (isFinalBoss) {
        document.getElementById("overlay-title").innerText = "VICTOIRE TOTALE SUR LE PAYS DES VAGUES !";
        document.getElementById("overlay-sub").innerText = "Le pont Naruto est achevé. Tu as triomphé de Zabuza !";
        const picker = document.getElementById("rewards-picker");
        picker.innerHTML = `<button id="end-turn-btn" style="padding:14px 30px; font-size:16px;" onclick="location.reload()">Recommencer la campagne</button>`;
      } else {
        document.getElementById("overlay-title").innerText = `Victoire sur ${STAGES[currentStageIndex].name} !`;
        document.getElementById("overlay-sub").innerText = "Choisis une technique à ajouter à ton deck pour la suite :";
        const picker = document.getElementById("rewards-picker");
        picker.innerHTML = "";

        REWARD_OPTIONS.forEach(reward => {
          const el = document.createElement("div");
          el.className = `card card-${reward.type}`;
          el.style.transform = "scale(1.05)";
          el.innerHTML = `
            <div class="card-top"><span class="card-title">${reward.name}</span><span class="card-cost">${reward.cost}</span></div>
            <div class="card-desc">${reward.desc}</div>
            <div class="card-tag">${reward.type}</div>
          `;
          el.onclick = () => {
            state.deck.push({ ...reward });
            overlay.style.display = "none";
            loadStage(currentStageIndex + 1);
          };
          picker.appendChild(el);
        });
      }
    }

    window.onload = initGame;
  </script>
</body>
</html>
